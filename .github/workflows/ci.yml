name: CI

# Typecheck and unit tests on every PR into main, and on main itself.
#
# Until this existed, `npm test` only ever ran on a developer machine — which
# is how eight tests stayed red on main from April to August without anyone
# noticing. A red suite can no longer reach main unremarked.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same PR makes the in-flight run obsolete; cancel it rather
# than paying for both.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the version the other workflows pin.
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Runs even when the typecheck fails, so one push reports both problems
      # instead of surfacing them one round-trip at a time.
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npm test
